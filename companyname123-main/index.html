<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#005E96" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>Hajz Telecommunication Co Ltd.</title>
    <meta name="description" content="Leading the telecommunications revolution with innovative solutions and unparalleled expertise in global connectivity." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Hajz Telecommunication Co Ltd.",
      "alternateName": "HTC",
      "url": "https://hajztelecom.com",
      "logo": "https://hajztelecom.com/og-image.jpg",
      "description": "Leading telecommunications company delivering innovative network infrastructure, enterprise connectivity, command & control systems, and managed services worldwide.",
      "foundingDate": "1992",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "url": "https://hajztelecom.com/contact"
      },
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Hajz Telecommunication Co Ltd.",
      "url": "https://hajztelecom.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://hajztelecom.com/sitemap?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </body>
</html>
